<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advisory Committee - SONSIK Official</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

 <header id="app-header" class="app-header"></header>

  <section class="main-container">
    <div class="section-header">
      <h2 class="section-title">Advisory Committee</h2>
      <p style="color:#64748b; margin-top:0.5rem;">Senior Scholars and Health Advisors guiding SONSIK</p>
    </div>
    <div class="grid-cards">
      <div class="card">
        <img src="gallery/photos/ec_president.svg" class="card-img" alt="Advisory Chair">
        <div class="card-content">
          <h3 class="card-title">Dr. Ramesh Chandra Gurung</h3>
          <p class="card-role">Advisory Chairperson</p>
          <p style="color:#64748b; font-size:0.9rem;">Senior Research Scientist, KIST</p>
        </div>
      </div>
      <div class="card">
        <img src="gallery/photos/ec_vice_president.svg" class="card-img" alt="Health Advisor">
        <div class="card-content">
          <h3 class="card-title">Dr. Sunita KC</h3>
          <p class="card-role">Health & Medical Advisor</p>
          <p style="color:#64748b; font-size:0.9rem;">Seoul National University Hospital</p>
        </div>
      </div>
    </div>
  </section>

  <footer id="app-footer" class="app-footer"></footer>

  <script src="js/components.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
