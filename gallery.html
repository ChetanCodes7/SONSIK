<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - SONSIK Official</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header id="app-header" class="app-header"></header>

  <section class="main-container">
    <div class="section-header">
      <h2 class="section-title">Photo Gallery</h2>
    </div>
    <div class="grid-cards">
      <div class="card">
        <img src="gallery/photos/photo4.jpg" class="card-img" alt="Gallery 4">
        <div class="card-content">
          <h3 class="card-title">SONSIK AGM 2026</h3>
        </div>
      </div>
      
      <div class="card">
        <img src="gallery/photos/photo1.jpg" class="card-img" alt="Gallery 1">
        <div class="card-content">
          <h3 class="card-title">Sports Festival 2026</h3>
        </div>
      </div>
      
      <div class="card">
        <img src="gallery/photos/photo2.jpg" class="card-img" alt="Gallery 2">
        <div class="card-content">
          <h3 class="card-title">Welcome Orientation</h3>
        </div>
      </div>
      
      <div class="card">
        <img src="gallery/photos/photo3.jpg" class="card-img" alt="Gallery 3">
        <div class="card-content">
          <h3 class="card-title">Nepalese Cultural Night</h3>
        </div>
      </div>
    </div>
  </section>

<footer id="app-footer" class="app-footer"></footer>

  <!-- Scripts -->
  <script src="js/components.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
