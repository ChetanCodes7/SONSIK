<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Support (SCF) - SONSIK Official</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header id="app-header" class="app-header"></header>

  <section class="main-container">
    <div class="section-header">
      <h2 class="section-title">Confidential Student Welfare (SCF)</h2>
    </div>
    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap:2rem;">
      <div style="background:white; padding:2rem; border-radius:12px; border:1px solid #e2e8f0;">
        <h3 style="color:#0f2b48; margin-bottom:0.5rem;">Request Support</h3>
        <p style="color:#64748b; margin-bottom:1rem; font-size:0.95rem;">For emergency health or welfare assistance.</p>
        <form>
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" class="form-control" placeholder="Student Name">
          </div>
          <div class="form-group">
            <label>Emergency Details</label>
            <textarea class="form-control" rows="4" placeholder="Describe the medical or financial support needed..."></textarea>
          </div>
          <button type="button" class="btn-accent" style="width:100%;">Submit Request</button>
        </form>
      </div>

      <div style="background:white; padding:2rem; border-radius:12px; border:1px solid #e2e8f0;">
        <h3 style="color:#0f2b48; margin-bottom:0.5rem;">Track Case Status</h3>
        <p style="color:#64748b; margin-bottom:1rem; font-size:0.95rem;">Enter your confidential reference ID.</p>
        <div class="form-group">
          <input type="text" id="scf-case-id" class="form-control" placeholder="e.g. SCF-2026-09">
        </div>
        <button type="button" id="btn-track-scf" class="btn-primary" style="width:100%;">Check Status</button>
        <div id="scf-status-result"></div>
      </div>
    </div>
  </section>

  <footer id="app-footer" class="app-footer"></footer>

  <!-- Scripts -->
  <script src="js/components.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
