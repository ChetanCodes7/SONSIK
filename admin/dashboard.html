<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - SONSIK Official</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="app-header">
    <nav class="nav-container">
      <a href="../index.html" class="brand-logo">
        <img src="../gallery/photos/logo.svg" alt="SONSIK Logo">
        <span>SONSIK Control Panel</span>
      </a>
      <a href="login.html" class="btn-accent">Logout</a>
    </nav>
  </header>

  <section class="main-container">
    <div class="section-header">
      <h2 class="section-title">23rd Committee Control Panel</h2>
    </div>
    <div class="grid-cards">
      <div class="card">
        <div class="card-content">
          <h3>Pending Welfare Requests (SCF)</h3>
          <p style="font-size:2.5rem; font-weight:800; color:#0f2b48; margin:0.5rem 0;">3</p>
          <p style="color:#64748b;">Under review by Executive Committee</p>
        </div>
      </div>
      <div class="card">
        <div class="card-content">
          <h3>Registered Active Members</h3>
          <p style="font-size:2.5rem; font-weight:800; color:#0f2b48; margin:0.5rem 0;">1,420</p>
          <p style="color:#64748b;">Verified Korean Universities</p>
        </div>
      </div>
    </div>
  </section>

  <footer class="app-footer">
    <div class="footer-bottom">
      <p>&copy; 2026 Society of Nepalese Students in Korea (SONSIK). All Rights Reserved.</p>
    </div>
  </footer>

</body>
</html>
