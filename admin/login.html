<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Officer Login - SONSIK Official</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="app-header">
    <nav class="nav-container">
      <a href="../index.html" class="brand-logo">
        <img src="../gallery/photos/logo.svg" alt="SONSIK Logo">
        <span>SONSIK</span>
      </a>
    </nav>
  </header>

  <section class="main-container" style="max-width:400px; margin-top:4rem;">
    <div style="background:white; padding:2rem; border-radius:12px; border:1px solid #e2e8f0; text-align:center;">
      <h2 style="color:#0f2b48; margin-bottom:1.5rem;">Officer Login</h2>
      <form>
        <div class="form-group" style="text-align:left;">
          <label>Officer ID</label>
          <input type="text" class="form-control" placeholder="ec-officer">
        </div>
        <div class="form-group" style="text-align:left;">
          <label>Password</label>
          <input type="password" class="form-control" placeholder="••••••••">
        </div>
        <a href="dashboard.html" class="btn-primary" style="width:100%; display:block; text-align:center;">Login to Dashboard</a>
      </form>
    </div>
  </section>

  <footer class="app-footer">
    <div class="footer-bottom">
      <p>&copy; 2026 Society of Nepalese Students in Korea (SONSIK). All Rights Reserved.</p>
    </div>
  </footer>

</body>
</html>
