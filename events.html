<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events & Programs - SONSIK Official</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

 <header id="app-header" class="app-header"></header>

  <section class="main-container">
    <div class="section-header">
      <h2 class="section-title">Events & Programs</h2>
    </div>
    <div class="grid-cards">
      <div class="card">
        <img src="gallery/photos/program_academic.svg" class="card-img" alt="Academic Symposium">
        <div class="card-content">
          <h3 class="card-title">13th Academic Symposium</h3>
          <p style="color:#64748b; font-size:0.95rem;">National research conference for Nepalese scholars in Korea.</p>
        </div>
      </div>
      <div class="card">
        <img src="gallery/photos/program_sonsik_cup.svg" class="card-img" alt="SONSIK Sports Cup">
        <div class="card-content">
          <h3 class="card-title">SONSIK Sports Cup 2026</h3>
          <p style="color:#64748b; font-size:0.95rem;">Inter-university sports tournament for students across Korea.</p>
        </div>
      </div>
    </div>
  </section>

  <footer id="app-footer" class="app-footer"></footer>

  <script src="js/components.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
