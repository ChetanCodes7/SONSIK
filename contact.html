<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - SONSIK</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header id="app-header" class="app-header"></header>

  <section class="main-container" style="max-width:600px;">
    <div class="section-header">
      <h2 class="section-title">Secretariat Contact</h2>
    </div>
    <div style="background:white; padding:2.5rem; border-radius:12px; border:1px solid #e2e8f0;">
      <form>
        <div class="form-group">
          <label>Your Name</label>
          <input type="text" class="form-control" placeholder="Full Name">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" class="form-control" placeholder="name@university.ac.kr">
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea class="form-control" rows="4" placeholder="How can we assist you?"></textarea>
        </div>
        <button type="button" class="btn-primary" style="width:100%; justify-content:center;">Send Message</button>
      </form>
    </div>
  </section>

  <footer id="app-footer" class="app-footer"></footer>
  
  <script src="js/components.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
