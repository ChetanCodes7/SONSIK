
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - SONSIK</title>
  
  <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header id="app-header" class="app-header"></header>

  <section class="main-container contact-container">

    <div class="section-header">
      <h2 class="section-title">Secretariat Contact</h2>
    </div>

    <div class="contact-card">
      <form class="contact-form">

        <div class="form-group">
          <label for="name">Your Name</label>
          <input
            type="text"
            id="name"
            name="name"
            class="form-control"
            placeholder="Full Name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="name@university.ac.kr"
            required
          >
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            class="form-control message-box"
            rows="4"
            placeholder="How can we assist you?"
            required
          ></textarea>
        </div>

        <button type="submit" class="btn-primary contact-submit">
          Send Message
        </button>

      </form>
    </div>

  </section>

  
  <!-- Social Media Links -->
  <section class="contact-social-section">
    <h3> SONSIK </h3> 
    <p>Phone No.: 010-4797-2772 </p>       
    <p>Email: doc.sonsik@gmail.com</p>
    <p>Connect with us on social media.</p>

    <div class="hero-social">
      <a href="https://www.tiktok.com/@sonsik_?_r=1&t=ZS-9AQxV9rBvL2"
         aria-label="TikTok"
         target="_blank"
         rel="noopener noreferrer">
        <i class="fa-brands fa-tiktok"></i>
      </a>

      <a href="https://x.com/sonsik_org?s=11"
         aria-label="Twitter (X)"
         target="_blank"
         rel="noopener noreferrer">
        <i class="fa-brands fa-x-twitter"></i>
      </a>

      <a href="https://www.instagram.com/_sonsik?rpxt=d2VzY2czNzc0eXpl"
         aria-label="Instagram"
         target="_blank"
         rel="noopener noreferrer">
        <i class="fa-brands fa-instagram"></i>
      </a>

      <a href="https://www.facebook.com/share/19hgYZY7GE/?mibextid=wwXIfr"
         aria-label="Facebook"
         target="_blank"
         rel="noopener noreferrer">
        <i class="fa-brands fa-facebook-f"></i>
      </a>
    </div>
  </section>

  <footer id="app-footer" class="app-footer"></footer>

  <script src="js/components.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
