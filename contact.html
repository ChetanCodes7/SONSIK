
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - SONSIK</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header id="app-header" class="app-header"></header>

  <section class="main-container contact-container">

    <div class="section-header">
      <h2 class="section-title">Secretariat Contact</h2>
    </div>

    <div class="contact-card">
      <form class="contact-form">

        <div class="form-group">
          <label for="name">Your Name</label>
          <input
            type="text"
            id="name"
            name="name"
            class="form-control"
            placeholder="Full Name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="name@university.ac.kr"
            required
          >
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            class="form-control message-box"
            rows="4"
            placeholder="How can we assist you?"
            required
          ></textarea>
        </div>

        <button type="submit" class="btn-primary contact-submit">
          Send Message
        </button>

      </form>
    </div>

  </section>

  <footer id="app-footer" class="app-footer"></footer>

  <script src="js/components.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
